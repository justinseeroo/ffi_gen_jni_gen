name: ffi_gen_jni_gen
description: "Reads native device features from Dart using bindings generated by jnigen (Android) and ffigen (iOS)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  jni: ^1.2.1
  jni_flutter: ^1.1.0
  objective_c: ^9.5.0
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  jnigen: ^1.1.0
  mocktail: ^1.0.5
  ffigen: ^21.0.0

flutter:
  uses-material-design: true
